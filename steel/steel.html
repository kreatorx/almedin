<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baza & AI Čelični Profili — Eurocode 3</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2c;
      --accent: #38bdf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #26334d;
      --error: #f87171;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container { max-width: 1400px; margin: 0 auto; }
    
    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    h1 { margin: 0; color: var(--accent); font-size: 1.6rem; }
    .subtitle { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .tab-btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Controls */
    .controls {
      display: flex;
      gap: 14px;
      background: var(--card-bg);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      align-items: flex-end;
    }

    .form-group { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; font-weight: bold; }
    
    input, select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    button.btn-action {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 9px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    button.btn-export {
      background: #1e293b;
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      margin-left: 6px;
    }
    button.btn-export:hover { background: #334155; }

    .main-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }

    @media (max-width: 992px) { .main-grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1rem;
      color: var(--accent);
      margin-top: 0;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .canvas-wrapper {
      background: #070a12;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      min-height: 280px;
    }

    canvas { background: transparent; }

    /* Tabela */
    .tables-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .axis-row-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      grid-column: 1 / -1;
    }

    @media (max-width: 768px) { .axis-row-grid { grid-template-columns: 1fr; } }

    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    td, th { padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); font-weight: 500; font-size: 0.78rem; }
    td.val { font-weight: 600; text-align: right; color: #60a5fa; }
    td.unit { color: var(--muted); font-size: 0.75rem; width: 60px; text-align: right; }

    details.raw-json {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      margin-top: 12px;
    }
    details.raw-json summary { cursor: pointer; color: var(--accent); font-weight: bold; font-size: 0.85rem; }
    details.raw-json pre { margin: 8px 0 0 0; background: #000; padding: 10px; border-radius: 4px; overflow-x: auto; color: #34d399; font-family: monospace; font-size: 0.8rem; }

    .status-msg { padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem; display: none; }
    .status-msg.loading { display: block; background: #1e293b; color: var(--accent); border: 1px solid var(--accent); }
    .status-msg.error { display: block; background: #3f1d1d; color: var(--error); border: 1px solid var(--error); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Baza & AI Proračun Profila — Eurocode 3</h1>
    <div class="subtitle">Google Gemini 2.5 Flash API & HTML5 Canvas Crtat (S235 čelik)</div>
  </header>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="ai-profile">1. AI Profil</button>
    <button class="tab-btn" data-tab="browser">2. Preglednik Baze</button>
    <button class="tab-btn" data-tab="ai-search">3. AI Dimenzionisanje (Uskoro)</button>
    <button class="tab-btn" data-tab="custom-calc">4. Proračun Proizvoljnog Profila (Uskoro)</button>
  </div>

  <!-- TAB 1: AI PROFIL -->
  <div id="tab-ai-profile" class="tab-content active">
    <div class="card">
      <h2 class="card-title">Pretraga Profila Preko AI Modela</h2>
      <div class="controls">
        <div class="form-group" style="flex: 3;">
          <label for="aiPromptInput">Naziv ili opis profila (Svjetski Standardi: IPE, HEA, WB 300, SHS 40x40x5, W12x26, L, C...)</label>
          <input type="text" id="aiPromptInput" placeholder="Npr. SHS 40x40x5, WB 300, IPE 240, HEA 300 ili opis 'C profil 200x80'">
        </div>
        <button class="btn-action" id="btnAiSearch">Generiši Profil (AI)</button>
      </div>

      <details id="rawJsonDetails" class="raw-json" style="display: none;">
        <summary>Prikaži sirovi AI JSON odgovor</summary>
        <pre><code id="rawJsonCode"></code></pre>
      </details>

      <div id="aiStatus" class="status-msg" style="margin-top: 12px;"></div>

      <div class="main-grid" id="aiResultsGrid" style="display: none; margin-top: 16px;">
        <div>
          <div class="card">
            <!-- Obratite pažnju na naslov: HTML5 Canvas -->
            <h2 class="card-title">Poprečni Presjek (HTML5 Canvas)</h2>
            <div class="canvas-wrapper">
              <canvas id="profileCanvas" width="280" height="280"></canvas>
            </div>
          </div>
        </div>

        <div>
          <div class="card">
            <h2 class="card-title">
              <span id="aiProfileTitle">Proračunata Svojstva Profila</span>
              <div>
                <button class="btn-export" onclick="exportToCSV()">CSV</button>
                <button class="btn-export" onclick="exportToPDF()">PDF</button>
              </div>
            </h2>
            <div id="aiSpecsContainer"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- TAB 2, 3, 4 REZERVISANI -->
  <div id="tab-browser" class="tab-content"><div class="card"><h2>2. Preglednik Baze</h2></div></div>
  <div id="tab-ai-search" class="tab-content"><div class="card"><h2>3. AI Dimenzionisanje</h2></div></div>
  <div id="tab-custom-calc" class="tab-content"><div class="card"><h2>4. Custom Profil</h2></div></div>

</div>

<script>
let currentAiData = null;

document.addEventListener('DOMContentLoaded', () => {
  const btnAi = document.getElementById('btnAiSearch');
  if (btnAi) btnAi.addEventListener('click', fetchProfileFromVercel);

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      e.target.classList.add('active');
      document.getElementById(`tab-${e.target.getAttribute('data-tab')}`).classList.add('active');
    });
  });
});

// Čišćenje simbola od $ znakova i pravilno postavljanje indeksnih oznaka
function formatSymbol(sym) {
  if (!sym || sym === '-') return '';
  let clean = sym.replace(/\$/g, '').trim();
  return clean.replace(/_([a-zA-Z0-9,]+)/g, '<sub>$1</sub>');
}

// -------------------------------------------------------------
// AI POZIV PREMA VERCEL BACKENDU
// -------------------------------------------------------------
async function fetchProfileFromVercel() {
  const promptInput = document.getElementById('aiPromptInput');
  const promptText = promptInput ? promptInput.value.trim() : '';
  const statusEl = document.getElementById('aiStatus');
  const resultsGrid = document.getElementById('aiResultsGrid');
  const rawDetails = document.getElementById('rawJsonDetails');
  const rawCode = document.getElementById('rawJsonCode');
  const btn = document.getElementById('btnAiSearch');

  if (!promptText) {
    showStatus("Molimo unesite naziv ili opis profila!", "error");
    return;
  }

  showStatus("Generišem profil i izračunavam svojstva...", "loading");
  btn.disabled = true;
  resultsGrid.style.display = "none";
  rawDetails.style.display = "none";

  try {
    const response = await fetch('/api/steel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: promptText })
    });

    if (!response.ok) {
      if (response.status === 404) {
        throw new Error("Ruta /api/steel ne postoji na lokalnom Live Serveru. Funkcija radi nakon deploy-a na Vercel.");
      }
      const errData = await response.json().catch(() => ({}));
      throw new Error(errData.error || `Greška HTTP Status: ${response.status}`);
    }

    const data = await response.json();
    currentAiData = data;

    // Prikaz sirovog JSON odgovora
    rawCode.textContent = JSON.stringify(data, null, 2);
    rawDetails.style.display = "block";
    rawDetails.open = false;

    // Ako profil nije pronađen
    if (data.found === false) {
      showStatus(data.error_message || `Profil "${promptText}" nije pronađen u priznatim standardima čelika!`, "error");
      return;
    }

    document.getElementById('aiProfileTitle').textContent = `${data.oznaka} (${data.standard || 'AI Generisano'})`;
    
    renderAiTables(data, 'aiSpecsContainer');
    drawCanvasProfile(data.draw_commands);

    statusEl.style.display = "none";
    resultsGrid.style.display = "grid";
  } catch (err) {
    console.error(err);
    showStatus(`Greška: ${err.message}`, "error");
  } finally {
    btn.disabled = false;
  }
}

function showStatus(text, type) {
  const el = document.getElementById('aiStatus');
  if (!el) return;
  el.textContent = text;
  el.className = `status-msg ${type}`;
}

// -------------------------------------------------------------
// UNIVERZALNI CANVAS CRTAČ SA KOTIRANjEM, OSAMA Y/Z I RADIJUSIMA INERCIJE
// -------------------------------------------------------------
function drawCanvasProfile(data) {
  const canvas = document.getElementById('profileCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  // Povećane dimenzije canvasa za smještaj kuta i oznaka
  const width = canvas.width;
  const height = canvas.height;

  // Očisti prethodni crtež
  ctx.clearRect(0, 0, width, height);

  if (!data || !data.draw_commands || !data.draw_commands.length) return;

  const commands = data.draw_commands;
  const dimensions = data.dimensions || [];
  const major_y = data.major_y || [];
  const minor_z = data.minor_z || [];

  // 1. Izračunavanje Bounding Box-a (graničnih dimenzija)
  let xMin = Infinity, xMax = -Infinity, yMin = Infinity, yMax = -Infinity;

  commands.forEach(cmd => {
    const type = cmd[0];
    if (type === 'moveTo' || type === 'lineTo') {
      xMin = Math.min(xMin, cmd[1]); xMax = Math.max(xMax, cmd[1]);
      yMin = Math.min(yMin, cmd[2]); yMax = Math.max(yMax, cmd[2]);
    } else if (type === 'arcTo') {
      xMin = Math.min(xMin, cmd[1], cmd[3]); xMax = Math.max(xMax, cmd[1], cmd[3]);
      yMin = Math.min(yMin, cmd[2], cmd[4]); yMax = Math.max(yMax, cmd[2], cmd[4]);
    } else if (type === 'arc') {
      xMin = Math.min(xMin, cmd[1] - cmd[3]); xMax = Math.max(xMax, cmd[1] + cmd[3]);
      yMin = Math.min(yMin, cmd[2] - cmd[3]); yMax = Math.max(yMax, cmd[2] + cmd[3]);
    }
  });

  const bWidth = xMax - xMin || 40;
  const bHeight = yMax - yMin || 40;
  const maxDim = Math.max(bWidth, bHeight);

  // Margina od 50px za kotne linije
  const margin = 50;
  const scale = (width - 2 * margin) / maxDim;
  const cx = width / 2 - ((xMin + xMax) / 2) * scale;
  const cy = height / 2 - ((yMin + yMax) / 2) * scale;

  const tx = (x) => cx + x * scale;
  const ty = (y) => cy + y * scale;

  // 2. CRTIČANjE NEUTRALNIH OSA (y-y horizontalno, z-z vertikalno)
  ctx.save();
  ctx.strokeStyle = '#ec4899'; // Roza / Magenta boja za ose
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 4]);

  // Horizontalna osa y-y
  ctx.beginPath();
  ctx.moveTo(15, cy);
  ctx.lineTo(width - 15, cy);
  ctx.stroke();

  // Vertikalna osa z-z
  ctx.beginPath();
  ctx.moveTo(cx, 15);
  ctx.lineTo(cx, height - 15);
  ctx.stroke();
  ctx.restore();

  // Ispis naziva osa y i z
  ctx.font = 'bold 12px Segoe UI, sans-serif';
  ctx.fillStyle = '#ec4899';
  ctx.fillText('y', width - 14, cy + 4);
  ctx.fillText('z', cx - 4, height - 4);

  // Crvena tačka u težištu (0,0)
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, 2 * Math.PI);
  ctx.fill();

  // 3. CRTIČANjE GEOMETRIJE POPREČNOG PRESJEKA
  ctx.beginPath();
  ctx.fillStyle = 'rgba(56, 189, 248, 0.22)';
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2;

  commands.forEach(cmd => {
    const type = cmd[0];
    if (type === 'moveTo') {
      ctx.moveTo(tx(cmd[1]), ty(cmd[2]));
    } else if (type === 'lineTo') {
      ctx.lineTo(tx(cmd[1]), ty(cmd[2]));
    } else if (type === 'arcTo') {
      ctx.arcTo(tx(cmd[1]), ty(cmd[2]), tx(cmd[3]), ty(cmd[4]), cmd[5] * scale);
    } else if (type === 'arc') {
      ctx.arc(tx(cmd[1]), ty(cmd[2]), cmd[3] * scale, cmd[4], cmd[5]);
    } else if (type === 'closePath') {
      ctx.closePath();
    }
  });

  ctx.fill('evenodd'); // Pravilo za unutrašnje rupe/šupljine
  ctx.stroke();

  // 4. CRTIČANjE RADIJUSA INERCIJE (i_y, i_z) NA OSAMA
  const iyItem = major_y.find(i => i.symbol && i.symbol.includes('i_y'));
  const izItem = minor_z.find(i => i.symbol && i.symbol.includes('i_z'));

  if (iyItem || izItem) {
    ctx.save();
    ctx.strokeStyle = '#fbbf24'; // Žuto-zlatna boja
    ctx.fillStyle = '#fbbf24';
    ctx.setLineDash([2, 2]);
    ctx.font = '10px Segoe UI, sans-serif';

    if (iyItem && iyItem.val) {
      const iyPx = iyItem.val * scale;
      ctx.beginPath();
      ctx.arc(cx, cy - iyPx, 2.5, 0, 2 * Math.PI);
      ctx.fill();
      ctx.fillText(`i_y=${iyItem.val}`, cx + 5, cy - iyPx + 3);
    }
    if (izItem && izItem.val) {
      const izPx = izItem.val * scale;
      ctx.beginPath();
      ctx.arc(cx + izPx, cy, 2.5, 0, 2 * Math.PI);
      ctx.fill();
      ctx.fillText(`i_z=${izItem.val}`, cx + izPx - 10, cy - 6);
    }
    ctx.restore();
  }

  // 5. INŽENjERSKO KOTIRANjE (h, b, tw, tf, r1, r2, r_o, r_i)
  drawProfileDimensions(ctx, dimensions, xMin, xMax, yMin, yMax, tx, ty);
}

// Funkcija za crtanje kotnih linija i oznaka dimenzija
function drawProfileDimensions(ctx, dimensions, xMin, xMax, yMin, yMax, tx, ty) {
  if (!dimensions || !dimensions.length) return;

  const hItem = dimensions.find(d => d.symbol === 'h' || d.label.toLowerCase().includes('depth'));
  const bItem = dimensions.find(d => d.symbol === 'b' || d.label.toLowerCase().includes('width'));
  const twItem = dimensions.find(d => d.symbol === 't_w' || d.symbol === 'tw' || d.symbol === 't');
  const tfItem = dimensions.find(d => d.symbol === 't_f' || d.symbol === 'tf');
  const r1Item = dimensions.find(d => d.symbol === 'r_1' || d.symbol === 'r' || d.symbol === 'r_o');
  const r2Item = dimensions.find(d => d.symbol === 'r_2' || d.symbol === 'r_i');

  ctx.save();
  ctx.strokeStyle = '#94a3b8'; // Siva boja za kote
  ctx.fillStyle = '#f1f5f9';
  ctx.font = '10px Segoe UI, sans-serif';
  ctx.lineWidth = 1;

  // Pomoćna funkcija za crtanje kotne linije sa koticama
  function drawDimLine(x1, y1, x2, y2, text, offset, isHoriz) {
    let px1 = x1, py1 = y1, px2 = x2, py2 = y2;
    if (isHoriz) {
      py1 += offset; py2 += offset;
      // Pomoćne linije od profila do kote
      ctx.beginPath();
      ctx.moveTo(x1, y1); ctx.lineTo(x1, py1 + (offset > 0 ? 4 : -4));
      ctx.moveTo(x2, y2); ctx.lineTo(x2, py2 + (offset > 0 ? 4 : -4));
      ctx.stroke();
      // Glavna kotna linija
      ctx.beginPath();
      ctx.moveTo(px1, py1); ctx.lineTo(px2, py2);
      ctx.stroke();
      // Kotice (kosi zarezi)
      drawTick(px1, py1); drawTick(px2, py2);
      // Tekst kote
      ctx.textAlign = 'center';
      ctx.fillText(text, (px1 + px2) / 2, py1 + (offset > 0 ? 12 : -5));
    } else {
      px1 += offset; px2 += offset;
      // Pomoćne linije od profila do kote
      ctx.beginPath();
      ctx.moveTo(x1, y1); ctx.lineTo(px1 + (offset > 0 ? 4 : -4), y1);
      ctx.moveTo(x2, y2); ctx.lineTo(px2 + (offset > 0 ? 4 : -4), y2);
      ctx.stroke();
      // Glavna kotna linija
      ctx.beginPath();
      ctx.moveTo(px1, py1); ctx.lineTo(px2, py2);
      ctx.stroke();
      // Kotice
      drawTick(px1, py1); drawTick(px2, py2);
      // Tekst kote
      ctx.textAlign = 'right';
      ctx.fillText(text, px1 + (offset > 0 ? -5 : -5), (py1 + py2) / 2 + 3);
    }
  }

  function drawTick(x, y) {
    ctx.beginPath();
    ctx.moveTo(x - 3, y + 3);
    ctx.lineTo(x + 3, y - 3);
    ctx.stroke();
  }

  // 1. Kota Visine (h) - Lijeva strana
  if (hItem) {
    drawDimLine(tx(xMin), ty(yMin), tx(xMin), ty(yMax), `h=${hItem.val}`, -22, false);
  }

  // 2. Kota Širine (b) - Gornja strana
  if (bItem) {
    drawDimLine(tx(xMin), ty(yMin), tx(xMax), ty(yMin), `b=${bItem.val}`, -20, true);
  }

  // 3. Tekstualne oznake debljina i radijusa (Desna strana gore)
  const annX = tx(xMax) + 12;
  let annY = ty(yMin) + 10;

  ctx.fillStyle = '#38bdf8';
  ctx.font = '10px Segoe UI, sans-serif';
  ctx.textAlign = 'left';

  const notes = [];
  if (twItem) notes.push(`${twItem.symbol.replace('_', '') || 'tw'}=${twItem.val}`);
  if (tfItem) notes.push(`tf=${tfItem.val}`);
  if (r1Item) notes.push(`${r1Item.symbol.replace('_', '') || 'r1'}=${r1Item.val}`);
  if (r2Item) notes.push(`${r2Item.symbol.replace('_', '') || 'r2'}=${r2Item.val}`);

  notes.forEach((note, idx) => {
    ctx.fillText(note, annX, annY + idx * 13);
  });

  ctx.restore();
}

// -------------------------------------------------------------
// RENDANJE TABELA
// -------------------------------------------------------------
function renderAiTables(data, containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;

  const buildRows = (arr) => {
    if (!arr || !arr.length) return '<tr><td colspan="3">-</td></tr>';
    return arr.map(item => `
      <tr>
        <td>${item.label} (${formatSymbol(item.symbol)})</td>
        <td class="val">${item.val}</td>
        <td class="unit">${item.unit}</td>
      </tr>
    `).join('');
  };

  container.innerHTML = `
    <div class="tables-grid">
      <div>
        <h3 style="color:var(--muted); font-size:0.85rem; border-bottom:1px solid var(--border); padding-bottom:4px; margin-top:0;">Profile Dimensions</h3>
        <table>${buildRows(data.dimensions)}</table>
      </div>
      <div>
        <h3 style="color:var(--muted); font-size:0.85rem; border-bottom:1px solid var(--border); padding-bottom:4px; margin-top:0;">Area & Mass Properties</h3>
        <table>${buildRows(data.area_properties)}</table>
      </div>
    </div>

    <div class="axis-row-grid" style="margin-top: 16px;">
      <div style="background: rgba(56, 189, 248, 0.03); padding: 8px; border-radius: 6px; border: 1px solid rgba(56, 189, 248, 0.1);">
        <h3 style="color:var(--accent); font-size:0.85rem; border-bottom:1px solid var(--border); padding-bottom:4px; margin-top:0;">Major Axis y-y Properties</h3>
        <table>${buildRows(data.major_y)}</table>
      </div>
      <div style="background: rgba(56, 189, 248, 0.03); padding: 8px; border-radius: 6px; border: 1px solid rgba(56, 189, 248, 0.1);">
        <h3 style="color:var(--accent); font-size:0.85rem; border-bottom:1px solid var(--border); padding-bottom:4px; margin-top:0;">Minor Axis z-z Properties</h3>
        <table>${buildRows(data.minor_z)}</table>
      </div>
    </div>

    <div class="tables-grid" style="margin-top: 16px;">
      <div>
        <h3 style="color:var(--muted); font-size:0.85rem; border-bottom:1px solid var(--border); padding-bottom:4px; margin-top:0;">Torsional & Warping Properties</h3>
        <table>${buildRows(data.torsion_warping)}</table>
      </div>
      <div>
        <h3 style="color:var(--muted); font-size:0.85rem; border-bottom:1px solid var(--border); padding-bottom:4px; margin-top:0;">Resistances (S235)</h3>
        <table>${buildRows(data.resistances_s235)}</table>
      </div>
      <div>
        <h3 style="color:var(--muted); font-size:0.85rem; border-bottom:1px solid var(--border); padding-bottom:4px; margin-top:0;">Buckling & Classification</h3>
        <table>${buildRows(data.buckling_classification)}</table>
      </div>
    </div>
  `;
}

// CSV & PDF IZVOZ
function exportToCSV() {
  if (!currentAiData || !currentAiData.found) return alert("Nema podataka za izvoz!");
  
  let rows = [["Kategorija", "Naziv", "Simbol", "Vrijednost", "Jedinica"]];
  const groups = ['dimensions', 'area_properties', 'major_y', 'minor_z', 'torsion_warping', 'resistances_s235', 'buckling_classification'];

  groups.forEach(g => {
    if (currentAiData[g]) {
      currentAiData[g].forEach(i => rows.push([g, i.label, i.symbol, i.val, i.unit]));
    }
  });

  const csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
  const link = document.createElement("a");
  link.setAttribute("href", encodeURI(csvContent));
  link.setAttribute("download", `${currentAiData.oznaka}_Eurocode3.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function exportToPDF() {
  if (!currentAiData || !currentAiData.found) return alert("Nema podataka za izvoz!");

  const printWindow = window.open('', '', 'width=900,height=800');
  printWindow.document.write(`
    <html>
      <head>
        <title>${currentAiData.oznaka} - Specifikacija</title>
        <style>
          body { font-family: Arial, sans-serif; padding: 20px; font-size: 11px; }
          h1 { border-bottom: 2px solid #000; padding-bottom: 4px; }
          table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
          td, th { border: 1px solid #ccc; padding: 4px 6px; }
          th { background: #f0f0f0; }
          .val { text-align: right; font-weight: bold; }
        </style>
      </head>
      <body>
        <h1>EUROCODE 3 SPECIFIKACIJA: ${currentAiData.oznaka} (${currentAiData.standard || ''})</h1>
        <p>Klasa čelika: S235 (&gamma;<sub>M0</sub> = 1.00)</p>
        
        <h3>Geometrija & Površina</h3>
        <table>${currentAiData.dimensions.map(i => `<tr><td>${i.label}</td><td class="val">${i.val} ${i.unit}</td></tr>`).join('')}</table>

        <h3>Osa y-y i z-z</h3>
        <table>
          <tr><th>Major Axis y-y</th><th>Minor Axis z-z</th></tr>
          <tr>
            <td><table>${currentAiData.major_y.map(i => `<tr><td>${i.label}</td><td class="val">${i.val} ${i.unit}</td></tr>`).join('')}</table></td>
            <td><table>${currentAiData.minor_z.map(i => `<tr><td>${i.label}</td><td class="val">${i.val} ${i.unit}</td></tr>`).join('')}</table></td>
          </tr>
        </table>
      </body>
    </html>
  `);
  printWindow.document.close();
  printWindow.focus();
  setTimeout(() => { printWindow.print(); printWindow.close(); }, 300);
}
