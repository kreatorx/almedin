function parseDXF(text) {
    state.dxfContours = [];
    state.dxfBgBox = null;
    const lines = text.split(/\r?\n/);
    let currentEntity = null, currentLayer = "", currentContour = null;
    let bgPoints = [], currentX = null;
    for (let i = 0; i < lines.length; i += 2) {
        let code = lines[i] ? lines[i].trim() : "";
        let val = lines[i + 1] ? lines[i + 1].trim() : "";
        if (code === '0') {
            if (currentContour && currentContour.points.length > 1) {
                if (currentLayer.toLowerCase().includes('bg')) bgPoints.push(...currentContour.points);
                else state.dxfContours.push(currentContour);
            }
            if (['LWPOLYLINE', 'POLYLINE', 'LINE', 'RECTANGLE'].includes(val)) {
                currentEntity = val;
                currentContour = { elevation: 250.0, points: [] };
                currentLayer = "";
            } else currentEntity = null;
        }
        if (currentEntity) {
            if (code === '8') currentLayer = val;
            if (code === '38') currentContour.elevation = parseFloat(val) || 250.0;
            if (code === '10') currentX = parseFloat(val);
            if (code === '20') {
                let y = parseFloat(val);
                if (currentX !== null) currentContour.points.push({ x: currentX, y });
            }
            if (code === '30' && parseFloat(val) !== 0) currentContour.elevation = parseFloat(val);
        }
    }
    if (bgPoints.length > 0) {
        let minX = Math.min(...bgPoints.map(p => p.x)), maxX = Math.max(...bgPoints.map(p => p.x));
        let minY = Math.min(...bgPoints.map(p => p.y)), maxY = Math.max(...bgPoints.map(p => p.y));
        state.dxfBgBox = { minX, minY, maxX, maxY, w: maxX - minX, h: maxY - minY };
        fitImageToDxfBox();
    }
    update3DScene();
    center3DCameraOnTerrain();
}

document.getElementById('img-input').addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
            state.bgImage = img;
            if (state.dxfBgBox) fitImageToDxfBox();
            else state.bgImgBounds = { x: 0, y: 0, w: img.width * 0.5, h: img.height * 0.5, scale: 1.0, isFitted: false };
            setMode('image');
        };
        img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
});

function setupLayoutSplitters() {
    const splitterVMain = document.getElementById('splitter-v-main');
    const splitterHLeft = document.getElementById('splitter-h-left');
    const splitterVTop = document.getElementById('splitter-v-top');

    const paneInspector = document.getElementById('pane-inspector');
    const pane3D = document.getElementById('pane-3d');
    const paneProfile = document.getElementById('pane-profile');
    const topZone = document.getElementById('top-zone');
    const panePlan = document.getElementById('pane-plan');
    const leftColumn = document.getElementById('left-column');
    const container = document.querySelector('.app-container');

    const btnToggle3D = document.getElementById('btn-toggle-3d');
    const btnToggleProfile = document.getElementById('btn-toggle-profile');
    const btnToggleInspector = document.getElementById('btn-toggle-inspector');

    let activeSplitter = null;

    function updateAllCanvases() {
        resizeCanvases();
        if (typeof renderPlanView === 'function') renderPlanView();
        if (typeof renderProfileView === 'function') renderProfileView();
    }

    btnToggleInspector.addEventListener('click', (e) => {
        e.stopPropagation();
        const isCollapsed = paneInspector.classList.toggle('pane-collapsed');
        btnToggleInspector.innerText = isCollapsed ? '◀' : '▶';
        btnToggleInspector.title = isCollapsed ? 'Prikaži Inspector' : 'Sakrij Inspector';
        updateAllCanvases();
    });

    btnToggle3D.addEventListener('click', (e) => {
        e.stopPropagation();
        const isCollapsed = pane3D.classList.toggle('pane-collapsed');
        if (isCollapsed) {
            panePlan.classList.add('pane-expanded');
            btnToggle3D.innerText = '▶';
            btnToggle3D.title = 'Prikaži 3D pregled';
        } else {
            panePlan.classList.remove('pane-expanded');
            btnToggle3D.innerText = '◀';
            btnToggle3D.title = 'Sakrij 3D pregled';
        }
        updateAllCanvases();
    });

    btnToggleProfile.addEventListener('click', (e) => {
        e.stopPropagation();
        const isCollapsed = paneProfile.classList.toggle('pane-collapsed');
        if (isCollapsed) {
            topZone.classList.add('pane-expanded');
            btnToggleProfile.innerText = '▲';
            btnToggleProfile.title = 'Prikaži Profil';
        } else {
            topZone.classList.remove('pane-expanded');
            btnToggleProfile.innerText = '▼';
            btnToggleProfile.title = 'Sakrij Profil';
        }
        updateAllCanvases();
    });

    splitterVMain.addEventListener('mousedown', (e) => { if (e.target !== btnToggleInspector) activeSplitter = 'V_MAIN'; });
    splitterHLeft.addEventListener('mousedown', (e) => { if (e.target !== btnToggleProfile) activeSplitter = 'H_LEFT'; });
    splitterVTop.addEventListener('mousedown', (e) => { if (e.target !== btnToggle3D) activeSplitter = 'V_TOP'; });

    window.addEventListener('mousemove', (e) => {
        if (!activeSplitter) return;

        if (activeSplitter === 'V_MAIN' && !paneInspector.classList.contains('pane-collapsed')) {
            const containerRect = container.getBoundingClientRect();
            const newInspectorWidth = containerRect.right - e.clientX;
            if (newInspectorWidth > 180 && newInspectorWidth < containerRect.width - 350) {
                paneInspector.style.width = `${newInspectorWidth}px`;
                updateAllCanvases();
            }
        } else if (activeSplitter === 'H_LEFT' && !paneProfile.classList.contains('pane-collapsed')) {
            const leftRect = leftColumn.getBoundingClientRect();
            const newTopHeight = e.clientY - leftRect.top;
            if (newTopHeight > 120 && newTopHeight < leftRect.height - 120) {
                topZone.style.flex = 'none';
                topZone.style.height = `${newTopHeight}px`;
                updateAllCanvases();
            }
        } else if (activeSplitter === 'V_TOP' && !pane3D.classList.contains('pane-collapsed')) {
            const topRect = topZone.getBoundingClientRect();
            const newPlanWidth = e.clientX - topRect.left;
            if (newPlanWidth > 180 && newPlanWidth < topRect.width - 120) {
                panePlan.style.flex = 'none';
                panePlan.style.width = `${newPlanWidth}px`;
                updateAllCanvases();
            }
        }
    });

    window.addEventListener('mouseup', () => {
        if (activeSplitter) {
            activeSplitter = null;
            updateAllCanvases();
        }
    });

    window.addEventListener('resize', updateAllCanvases);
    updateAllCanvases();
}

/* ============================================================
   18. INICIJALIZACIJA
   ============================================================ */
updateAlignmentDropdown();
init3D();
setupLayoutSplitters();
generateDemoTerrain();
startMainLoop();
</script>
